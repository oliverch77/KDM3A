name: R syntax

"on":
  push:
    paths: ["*.R", ".github/workflows/r-syntax.yml"]
  pull_request:
    paths: ["*.R", ".github/workflows/r-syntax.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Parse scripts without loading libraries or running analyses
        shell: Rscript {0}
        run: |
          invisible(parse(file = "01_bulk_DE_volcano.R"))
          invisible(parse(file = "02_single_cell_scores.R"))
          cat("Both scripts passed R syntax checks.\n")
